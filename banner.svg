<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300">
  <!-- Dark gradient background -->
  <defs>
    <linearGradient id="heroGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0a0e27;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#16213e;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <rect width="1200" height="300" fill="url(#heroGrad)"/>
  
  <!-- Decorative game board grid lines (subtle) -->
  <g stroke="#00d4ff" stroke-width="1" opacity="0.15">
    <line x1="50" y1="0" x2="50" y2="300"/>
    <line x1="150" y1="0" x2="150" y2="300"/>
    <line x1="250" y1="0" x2="250" y2="300"/>
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="150" x2="1200" y2="150"/>
    <line x1="0" y1="220" x2="1200" y2="220"/>
  </g>
  
  <!-- Left decorative chat bubble -->
  <path d="M 100 50 L 180 50 L 180 120 L 200 120 L 185 135 Q 175 140 165 140 L 100 140 Q 85 140 85 125 L 85 65 Q 85 50 100 50 Z" 
        fill="none" stroke="#00d4ff" stroke-width="2" opacity="0.6"/>
  
  <!-- Right decorative chat bubble -->
  <path d="M 1050 170 L 1130 170 L 1130 240 L 1150 240 L 1135 255 Q 1125 260 1115 260 L 1050 260 Q 1035 260 1035 245 L 1035 185 Q 1035 170 1050 170 Z" 
        fill="none" stroke="#0099cc" stroke-width="2" opacity="0.6"/>
  
  <!-- Center title and tagline -->
  <text x="600" y="130" font-family="Arial, sans-serif" font-size="56" font-weight="bold" fill="#ffffff" text-anchor="middle">
    LM-GAME-ENGINE
  </text>
  
  <text x="600" y="180" font-family="Arial, sans-serif" font-size="20" fill="#00d4ff" text-anchor="middle">
    Prompt-based games orchestrated by language models
  </text>
  
  <!-- Decorative accent lines -->
  <line x1="300" y1="210" x2="900" y2="210" stroke="#00d4ff" stroke-width="2" opacity="0.3"/>
</svg>