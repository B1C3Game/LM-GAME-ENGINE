<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Background -->
  <rect width="256" height="256" fill="#0a0e27"/>
  
  <!-- Single bold game piece: stylized dice with clear, bold strokes -->
  <g>
    <!-- Main cube -->
    <rect x="50" y="50" width="156" height="156" 
          fill="none" stroke="#00d4ff" stroke-width="8" stroke-linejoin="round"/>
    
    <!-- Inner accent cross (representing game/rules) -->
    <line x1="100" y1="128" x2="156" y2="128" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
    <line x1="128" y1="100" x2="128" y2="156" stroke="#00d4ff" stroke-width="6" stroke-linecap="round"/>
  </g>
</svg>